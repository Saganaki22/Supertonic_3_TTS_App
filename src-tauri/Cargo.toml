[package]
name = "supertonic-3-tts-app"
version = "0.1.3"
description = "Supertonic 3 TTS App — on-device text-to-speech"
authors = ["drbaph"]
license = "MIT"
edition = "2021"

[lib]
name = "supertonic_3_tts_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
pdf-extract = "0.7"
docx-rs = "0.4"
tauri-plugin-window-state = "2.4.1"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
panic = "abort"
